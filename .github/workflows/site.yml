# Build, check and deploy the site to Cloudflare Workers; keep the docs mirror in sync.
#
# - pull_request: sync check + quality gates + preview upload (same-repo PRs only).
# - push to main: gates + production deploy.
# - schedule / workflow_dispatch / repository_dispatch (type webmux-release): re-sync the docs
#   mirror and assets from the latest mzdluo123/webmux release (main fallback, see
#   scripts/lib/source.mjs), commit the diff to main, then build and deploy it in the same run
#   (pushes made with GITHUB_TOKEN do not trigger new workflow runs).
#
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit), CLOUDFLARE_ACCOUNT_ID.
# Optional repository variables: SITE_URL (canonical origin), PUBLIC_CF_WEB_ANALYTICS_TOKEN.
name: Site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "mzdluo123/webmux ref to mirror (empty = latest release, main fallback)"
        required: false
  repository_dispatch:
    types: [webmux-release]

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL }}
  PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_WEB_ANALYTICS_TOKEN }}

jobs:
  sync:
    name: Sync docs mirror
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync from mzdluo123/webmux
        run: pnpm sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEBMUX_REF: ${{ inputs.ref || github.event.client_payload.ref }}
      - name: Refresh release data fallback copy
        run: pnpm fetch-releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit changes
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            ref=$(node -p 'const m=require("./src/data/docs-manifest.json"); m.ref + " @ " + m.commit.slice(0,12)')
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(sync): mirror mzdluo123/webmux ${ref}"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and check
    needs: sync
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Docs mirror matches its manifest
        run: pnpm sync:check
      - name: Format
        run: pnpm format:check
      - name: Type check
        run: pnpm check
      - name: Build
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Links and anchors
        run: pnpm test:links
      - name: HTML validation
        run: pnpm test:html
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Accessibility (axe) and 320px overflow
        run: pnpm test:a11y
      - name: Lighthouse budgets
        run: pnpm test:lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: wrangler deploy
        id: deploy
        run: |
          pnpm exec wrangler deploy 2>&1 | tee deploy.log
          echo "url=$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n1)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  preview:
    name: Preview upload
    needs: build
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: wrangler versions upload
        id: upload
        run: |
          pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" 2>&1 | tee upload.log
          echo "url=$(grep -Eo 'https://pr-[a-z0-9.-]+\.workers\.dev' upload.log | head -n1)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment preview URL
        if: steps.upload.outputs.url != ''
        uses: actions/github-script@v9
        with:
          script: |
            const body = `Preview: ${{ steps.upload.outputs.url }}`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find((c) => c.user.type === "Bot" && c.body.startsWith("Preview:"));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
